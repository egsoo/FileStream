<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{file_name}} — FileStream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222536;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --text: #e8eaf0;
      --text-muted: #8b8fa8;
      --border: #2e3250;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Navbar ── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-brand {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
      text-decoration: none;
    }
    .navbar-brand span { color: var(--text); }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    /* ── Icon ── */
    .icon-wrap {
      width: 72px;
      height: 72px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .icon-wrap svg {
      color: var(--accent);
    }

    /* ── File details ── */
    .file-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .file-size {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 -32px 28px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      margin-bottom: 10px;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #2a2e42; }

    /* ── Copy feedback ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      pointer-events: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      z-index: 200;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ── Note ── */
    .note {
      margin-top: 20px;
      font-size: 0.76rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 18px;
      color: var(--text-muted);
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 500px) {
      .card { padding: 28px 20px; }
      .divider { margin: 0 -20px 24px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a class="navbar-brand" href="#">File<span>Stream</span></a>
    <span style="font-size:0.78rem; color:var(--text-muted);">Telegram File Streaming</span>
  </nav>

  <main class="main">
    <div class="card">

      <div class="icon-wrap">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
      </div>

      <div class="file-name">{{file_name}}</div>
      <div class="file-size">{{file_size}}</div>

      <div class="divider"></div>

      <a class="btn btn-primary" href="{{file_url}}" download>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download File
      </a>

      <button class="btn btn-secondary" onclick="copyLink()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy Download Link
      </button>

      <p class="note">
        This link streams directly from Telegram. No sign-in required.<br />
        Link may expire if the source file is deleted.
      </p>
    </div>
  </main>

  <footer>
    Powered by <a href="https://telegram.org" target="_blank">Telegram</a> &amp; FileStream Bot
  </footer>

  <div class="toast" id="toast">✅ Link copied to clipboard</div>

  <script>
    function copyLink() {
      navigator.clipboard.writeText('{{file_url}}').then(() => showToast('✅ Link copied to clipboard'));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
